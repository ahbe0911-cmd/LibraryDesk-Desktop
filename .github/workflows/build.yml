name: Build LibraryDesk Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source-b64\part-*.txt" | Sort-Object Name
          if (!$parts) { throw "Source chunks not found" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("LibraryDesk-Source.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "build-src" | Out-Null
          Expand-Archive -Path "LibraryDesk-Source.zip" -DestinationPath "build-src" -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: build-src
        run: npm install --no-audit --no-fund

      - name: Build Windows x64 Setup
        working-directory: build-src
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LibraryDesk-1.0.9-Setup-Win10-x64
          path: build-src/dist/LibraryDesk-Setup-1.0.9-Win10-x64.exe
          if-no-files-found: error

      - name: Upload unpacked portable
        uses: actions/upload-artifact@v4
        with:
          name: LibraryDesk-1.0.9-Portable-Win10-x64
          path: build-src/dist/win-unpacked/**
          if-no-files-found: error
