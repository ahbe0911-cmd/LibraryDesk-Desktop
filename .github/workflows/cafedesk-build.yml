name: Build CafeDesk 1.0.0

on:
  push:
    branches:
      - cafedesk
    paths:
      - 'cafedesk/**'
      - '.github/workflows/cafedesk-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cafedesk
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        working-directory: cafedesk
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check app/app.js

      - name: Dependency audit
        working-directory: cafedesk
        shell: pwsh
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build Windows x64 Setup
        working-directory: cafedesk
        shell: pwsh
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CafeDesk-1.0.0-Setup-Win10-x64
          path: cafedesk/dist/CafeDesk-Setup-1.0.0-Win10-x64.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: CafeDesk-1.0.0-Portable-Win10-x64
          path: cafedesk/dist/win-unpacked/**
          if-no-files-found: error
