name: Build CafeDesk 1.0.1

on:
  push:
    branches:
      - cafedesk
    paths:
      - 'cafedesk/**'
      - 'source-b64/**'
      - '.github/workflows/cafedesk-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Persian fonts
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source-b64\part-*.txt" | Sort-Object Name
          if (!$parts) { throw "LibraryDesk source chunks not found" }

          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("legacy-source.zip", [Convert]::FromBase64String($b64))

          New-Item -ItemType Directory -Force -Path "legacy-src" | Out-Null
          Expand-Archive -Path "legacy-source.zip" -DestinationPath "legacy-src" -Force

          $roo = Get-ChildItem "legacy-src" -Recurse -File |
            Where-Object { $_.Extension -ieq ".ttf" -and $_.Name -match "Rooznameh" } |
            Select-Object -First 1

          $vaz = Get-ChildItem "legacy-src" -Recurse -File |
            Where-Object { $_.Extension -ieq ".ttf" -and $_.Name -match "Vazir" } |
            Sort-Object @{Expression={ if ($_.Name -match "Regular") {0} else {1} }}, Name |
            Select-Object -First 1

          if (!$roo) {
            Write-Host "Font candidates:"
            Get-ChildItem "legacy-src" -Recurse -File | Where-Object { $_.Extension -ieq ".ttf" } | Select-Object FullName
            throw "A-Rooznameh font not found"
          }

          if (!$vaz) {
            Write-Host "Font candidates:"
            Get-ChildItem "legacy-src" -Recurse -File | Where-Object { $_.Extension -ieq ".ttf" } | Select-Object FullName
            throw "Vazir/Vazirmatn font not found"
          }

          New-Item -ItemType Directory -Force -Path "cafedesk\app\fonts" | Out-Null
          Copy-Item $roo.FullName "cafedesk\app\fonts\A-Rooznameh.ttf" -Force
          Copy-Item $vaz.FullName "cafedesk\app\fonts\Vazirmatn-Regular.ttf" -Force

          Write-Host "A-Rooznameh:" $roo.FullName
          Write-Host "Vazirmatn:" $vaz.FullName

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cafedesk
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        working-directory: cafedesk
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check app/app.js

      - name: Verify fonts
        shell: pwsh
        run: |
          if (!(Test-Path "cafedesk\app\fonts\A-Rooznameh.ttf")) { throw "A-Rooznameh missing" }
          if (!(Test-Path "cafedesk\app\fonts\Vazirmatn-Regular.ttf")) { throw "Vazirmatn missing" }

      - name: Dependency audit
        working-directory: cafedesk
        shell: pwsh
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build Windows x64 Setup
        working-directory: cafedesk
        shell: pwsh
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CafeDesk-1.0.1-Setup-Win10-x64
          path: cafedesk/dist/CafeDesk-Setup-1.0.1-Win10-x64.exe
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: CafeDesk-1.0.1-Portable-Win10-x64
          path: cafedesk/dist/win-unpacked/**
          if-no-files-found: error
